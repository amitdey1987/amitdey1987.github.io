<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="A printable count of the days since September 2, 2026."
  >
  <title>Days Since September 2, 2026</title>

  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4efe6;
      color: #152c28;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(233, 179, 71, 0.22),
          transparent 32rem
        ),
        linear-gradient(145deg, #f9f5ed, #eee5d8);
    }

    main {
      width: min(100%, 50rem);
      padding: clamp(2.5rem, 7vw, 5.5rem);
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(21, 44, 40, 0.15);
      border-radius: 2rem;
      box-shadow: 0 1.5rem 4rem rgba(50, 40, 24, 0.12);
    }

    .eyebrow {
      margin: 0 0 1.3rem;
      color: #a15c2f;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .count {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(7rem, 28vw, 14rem);
      font-variant-numeric: tabular-nums;
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 0.76;
    }

    h1 {
      margin: 2rem 0 0.7rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      line-height: 1;
    }

    .dates {
      margin: 0;
      color: #5e6965;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
    }

    button {
      margin-top: 2.25rem;
      padding: 0.8rem 1.25rem;
      border: 0;
      border-radius: 999px;
      background: #152c28;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #254b44;
    }

    button:focus-visible {
      outline: 3px solid #e9b347;
      outline-offset: 4px;
    }

    @media print {
      @page {
        size: portrait;
        margin: 0.5in;
      }

      :root,
      body {
        background: #fff;
      }

      body {
        min-height: auto;
        padding: 0;
      }

      main {
        width: 100%;
        min-height: 9.5in;
        display: grid;
        align-content: center;
        border: 2px solid #152c28;
        border-radius: 0;
        box-shadow: none;
        background: #fff;
      }

      button {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">September 2, 2026 → Today</p>
    <p class="count" id="day-count" aria-live="polite">—</p>
    <h1 id="headline">Days Since</h1>
    <p class="dates" id="date-range">Calculating…</p>
    <button type="button" onclick="window.print()">Print this page</button>
  </main>

  <script>
    const start = new Date(2026, 8, 2);
    const today = new Date();

    // Convert local calendar dates to UTC before subtracting them.
    // This prevents daylight-saving changes from affecting the result.
    const startUtc = Date.UTC(
      start.getFullYear(),
      start.getMonth(),
      start.getDate()
    );

    const todayUtc = Date.UTC(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

    const days = Math.floor((todayUtc - startUtc) / 86400000);

    const format = new Intl.DateTimeFormat(undefined, {
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    document.getElementById("day-count").textContent =
      Math.abs(days).toLocaleString();

    document.getElementById("headline").textContent =
      days >= 0
        ? `Day${days === 1 ? "" : "s"} Since`
        : `Day${days === -1 ? "" : "s"} Until`;

    document.getElementById("date-range").textContent =
      days >= 0
        ? `${format.format(start)} — ${format.format(today)}`
        : `${format.format(today)} — ${format.format(start)}`;
  </script>
</body>
</html>
