<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="A printable count of the days since September 2, 2026."
  >
  <title>Dashboard</title>

  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4efe6;
      color: #152c28;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(0.75rem, 2vh, 2rem);
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(233, 179, 71, 0.22),
          transparent 32rem
        ),
        linear-gradient(145deg, #f9f5ed, #eee5d8);
    }

    main {
      width: min(100%, 68rem);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(0.75rem, 2vh, 1.5rem);
    }

    .card {
      display: grid;
      align-items: start;
      justify-items: center;
      padding: clamp(1.25rem, 4vh, 3rem) clamp(1.25rem, 4vw, 3rem);
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(21, 44, 40, 0.15);
      border-radius: 2rem;
      box-shadow: 0 1.5rem 4rem rgba(50, 40, 24, 0.12);
    }

    .message {
      width: 100%;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 2.5vw, 2.25rem);
      font-weight: 400;
      line-height: 1.1;
    }

    .number {
      display: grid;
      place-items: center;
      height: 1em;
      margin-bottom: clamp(0.5rem, 1.5vh, 1.25rem);
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(4rem, 10vw, 8rem);
      font-variant-numeric: lining-nums tabular-nums;
      letter-spacing: -0.07em;
      line-height: 0.78;
    }

    @media (max-width: 48rem) {
      main {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      @page {
        size: portrait;
        margin: 0.5in;
      }

      :root,
      body {
        background: #fff;
      }

      body {
        min-height: auto;
        padding: 0;
      }

      main {
        width: 100%;
        min-height: 9.5in;
        display: grid;
        grid-template-columns: 1fr;
        align-content: center;
        gap: 0.35in;
      }

      .card {
        border: 2px solid #152c28;
        border-radius: 0;
        box-shadow: none;
        background: #fff;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="card">
      <p class="message">
        <span class="number" id="day-count" aria-live="polite">—</span>
        days since news
      </p>
    </section>

    <section class="card">
      <p class="message">
        <span class="number" id="days-until" aria-live="polite">—</span>
        days until pay stops
      </p>
    </section>

    <section class="card">
      <p class="message">
        <span class="number" id="leetcode-target" aria-live="polite">—</span>
        target leetcode solved
      </p>
    </section>
  </main>

  <script>
    const start = new Date(2026, 8, 2);
    const today = new Date();

    const startUtc = Date.UTC(
      start.getFullYear(),
      start.getMonth(),
      start.getDate()
    );

    const todayUtc = Date.UTC(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

    const days = Math.floor(
      (todayUtc - startUtc) / 86400000
    );

    const destination = new Date(2027, 1, 22);

    const destinationUtc = Date.UTC(
      destination.getFullYear(),
      destination.getMonth(),
      destination.getDate()
    );

    const daysUntil = Math.ceil(
      (destinationUtc - todayUtc) / 86400000
    );

    document.getElementById("day-count").textContent =
      Math.abs(days).toLocaleString();

    document.getElementById("days-until").textContent =
      Math.abs(daysUntil).toLocaleString();

    document.getElementById("leetcode-target").textContent =
      (Math.abs(days) * 4).toLocaleString();
  </script>
</body>
</html>
